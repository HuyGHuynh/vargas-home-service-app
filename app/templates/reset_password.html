<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <title>Reset Password</title>
</head>

<body>

    <button onclick="window.location.href='/'"> Home </button> <!-- To go home -->

    <form id="resetPassword" onsubmit="resetPassword(event)">

        <center>
            <h2>Reset Your Password</h2>
            <p>Please enter your new password below.</p>
            
            <label for="newPassword">New Password:</label><br>
            <input type="password" placeholder="Enter new password" id="newPassword" name="newPassword" required><br>

            <label for="confirmPassword">Confirm Password:</label><br>
            <input type="password" placeholder="Confirm new password" id="confirmPassword" name="confirmPassword" required><br><br>

            <input type="submit" value="Reset Password">
            
            <br><br>
            <a href="/login">Back to Login</a>
        </center>
        <center>
            <p id="resetMessage"></p>
        </center>

    </form>

    <script>
        async function resetPassword(event) {
            event.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const token = "{{ token }}";
            
            if (newPassword !== confirmPassword) {
                document.getElementById('resetMessage').textContent = 'Passwords do not match.';
                return;
            }
            
            if (newPassword.length < 6) {
                document.getElementById('resetMessage').textContent = 'Password must be at least 6 characters long.';
                return;
            }
            
            try {
                const response = await fetch(`/api/reset-password/${token}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        new_password: newPassword
                    })
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    document.getElementById('resetMessage').style.color = 'green';
                    document.getElementById('resetMessage').textContent = 'Password reset successfully! Redirecting to login...';
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    document.getElementById('resetMessage').style.color = 'red';
                    document.getElementById('resetMessage').textContent = result.message || 'Failed to reset password.';
                }
            } catch (error) {
                document.getElementById('resetMessage').style.color = 'red';
                document.getElementById('resetMessage').textContent = 'An error occurred. Please try again.';
            }
        }
    </script>

    <style>
        #resetMessage {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>

</body>

</html>
